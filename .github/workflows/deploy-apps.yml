name: deploy-apps
run-name: deploy-apps ${{ github.ref_name }}

# 手动触发：在 Actions 页面选择 dev 或 main 分支运行。
# 只并行发布 platform 和 admin，不跑 db-service（不执行 Prisma migrate、不跑种子）。
# 适用于只改了前端 / 应用代码的场景；涉及 schema、共享网络或首次部署时请用 deploy-all.yml。
# 部署逻辑直接复用 platform.yml、admin.yml，这里只做编排，不要复制部署步骤。
on:
  workflow_dispatch:

# 被调用的 platform.yml 里 build job 需要 packages: write 推 GHCR 镜像，
# 调用方授予的权限是上限，必须在这里放开。
permissions:
  contents: read
  packages: write

# group 名不能与子 workflow 的 platform-* / admin-deploy-* 重名，否则会互相等待造成死锁。
concurrency:
  group: deploy-apps-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  platform:
    name: platform
    uses: ./.github/workflows/platform.yml
    secrets: inherit

  admin:
    name: admin
    uses: ./.github/workflows/admin.yml
    secrets: inherit
