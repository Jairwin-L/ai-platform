name: platform
run-name: platform deploy ${{ github.ref_name }}

# 手动触发：在 Actions 页面选择 dev 或 main 分支运行。
# 分支决定环境：main -> production，dev -> development。
# 数据库、Redis、Prisma 由 db-service workflow 负责，这里只发布 Next.js 容器。
# API_INTERNAL_ORIGIN 在构建期烘进 rewrites，且 dev / prod 的 db-service 端口不同，所以两个分支各自构建镜像。
on:
  workflow_dispatch:
  # 供 deploy-all.yml / deploy-apps.yml 编排调用
  workflow_call:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate with Vite+
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment branch
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            dev|main)
              ;;
            *)
              echo "Unsupported deployment branch: ${GITHUB_REF_NAME}" >&2
              echo "Use dev or main." >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      # 全量安装：lint 用的根 stylelint.config.mjs 需要解析根 devDependencies 里的 stylelint-config-ali
      - name: Install dependencies
        run: vp install --frozen-lockfile

      # platform 的 lint = `vp check`（类型 + oxlint + 格式）+ stylelint，已按包作用域执行
      - name: Lint platform
        run: vpr @ai/platform#lint

      - name: Test platform
        run: vpr @ai/platform#test

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      app_image: ${{ steps.image.outputs.tag }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag=${IMAGE_NAME}:front-end-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile 在 apps/platform 下，但 context 必须是仓库根：
      # pnpm workspace 安装需要根 lockfile 和所有包的 package.json。
      - name: Build and push platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          # 未配置 vars.API_INTERNAL_ORIGIN 时按环境取 db-service 栈的默认端口（与 apps/db-service/scripts/deploy.sh 对齐）
          build-args: |
            API_INTERNAL_ORIGIN=${{ vars.API_INTERNAL_ORIGIN || (github.ref_name == 'main' && 'http://db-service:8072' || 'http://db-service:8070') }}
          # 只推不可变的 sha tag：可变 latest 会被 main / dev 互相覆盖（转发目标已烘进镜像层），
          # 而且被部署脚本的 keep 名单保留，在服务器上白占一份完整镜像。
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=platform-runner
          cache-to: type=gha,scope=platform-runner,mode=max,ignore-error=true

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            apps/platform/docker-compose.yml
            apps/platform/scripts/deploy.sh
          sparse-checkout-cone-mode: false

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          : "${DEPLOY_HOST:?Missing required secret DEPLOY_HOST}"
          : "${DEPLOY_PORT:?Missing required secret DEPLOY_PORT}"
          : "${DEPLOY_SSH_KEY:?Missing required secret DEPLOY_SSH_KEY}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts || {
            echo "Failed to scan SSH host key for ${DEPLOY_HOST}:${DEPLOY_PORT}."
            echo "Check DEPLOY_HOST, DEPLOY_PORT, firewall rules, and whether SSH is reachable from GitHub Actions."
            exit 1
          }

      - name: Pull image and restart platform
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PLATFORM_PATH: ${{ vars.DEPLOY_PLATFORM_PATH }}
          # 端口 / 网络名 / Compose project 等固定配置全部由
          # apps/platform/scripts/deploy.sh 按环境提供，这里不再重复一份。
          DEPLOY_ENV_FILE: ${{ github.ref_name == 'main' && '.env.production' || '.env.development' }}
          DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ needs.build.outputs.app_image }}
          API_INTERNAL_ORIGIN: ${{ vars.API_INTERNAL_ORIGIN }}
        run: |
          : "${DEPLOY_HOST:?Missing required secret DEPLOY_HOST}"
          : "${DEPLOY_PORT:?Missing required secret DEPLOY_PORT}"
          : "${DEPLOY_USER:?Missing required secret DEPLOY_USER}"
          : "${DEPLOY_PLATFORM_PATH:?Missing required variable DEPLOY_PLATFORM_PATH}"
          : "${DEPLOY_ENV_FILE:?Missing DEPLOY_ENV_FILE}"
          : "${DEPLOY_ENVIRONMENT:?Missing DEPLOY_ENVIRONMENT}"
          : "${GHCR_READ_TOKEN:?Missing GHCR token}"
          : "${APP_IMAGE:?Missing platform image tag}"

          remote_dir="${DEPLOY_PLATFORM_PATH}"
          runtime_env="$(mktemp)"
          remote_env_tmp="/tmp/ai-platform-app-${DEPLOY_ENVIRONMENT}-${GITHUB_SHA}.env"
          trap 'rm -f "${runtime_env}"' EXIT

          ssh_run() {
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"
          }

          write_env() {
            local key="$1"
            local value="$2"

            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "Environment value for ${key} must be a single line." >&2
              exit 1
            fi

            value=${value//\'/\'\\\'\'}
            printf "%s='%s'\n" "${key}" "${value}" >> "${runtime_env}"
          }

          # 只有真正配了值才写进 env 文件；写成空串会让 deploy.sh / compose
          # 认为"已显式配置"，从而绕过按环境推导的默认值。
          write_env_optional() {
            local key="$1"

            if [[ -z "${!key:-}" ]]; then
              return
            fi

            write_env "${key}" "${!key}"
          }

          write_env APP_IMAGE "${APP_IMAGE}"
          write_env_optional API_INTERNAL_ORIGIN

          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT}" \
            "${runtime_env}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_env_tmp}"

          ssh_run "mkdir -p '${remote_dir}/scripts'"

          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT}" \
            apps/platform/docker-compose.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_dir}/"

          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT}" \
            apps/platform/scripts/deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_dir}/scripts/deploy.sh"

          # token 走 stdin，不出现在服务器的进程参数里
          printf '%s\n' "${GHCR_READ_TOKEN}" | ssh_run \
            "docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin"

          ssh_run "cd '${remote_dir}' && \
             mv '${remote_env_tmp}' '${DEPLOY_ENV_FILE}' && \
             chmod 600 '${DEPLOY_ENV_FILE}' && \
             chmod +x scripts/deploy.sh && \
             DEPLOY_ENV_FILE='${DEPLOY_ENV_FILE}' scripts/deploy.sh '${DEPLOY_ENVIRONMENT}' '${APP_IMAGE}'"
